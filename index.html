<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your discount is ready</title>
<meta name="description" content="Scan worked. Open the menu and order.">
<meta name="theme-color" content="#D9310F">

<!-- ============================================================
     EDIT THIS LINE ONLY: your bot's username, without the @
     ============================================================ -->
<script>const BOT = "Customresbs_bot";</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">

<style>
  :root {
    --red:     #D9310F;
    --ink:     #24100B;
    --ivory:   #FFF3E4;
    --mustard: #F5B301;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--red);
    color: var(--ivory);
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 6vw, 40px);
    padding-bottom: max(clamp(20px, 6vw, 40px), env(safe-area-inset-bottom));
    gap: clamp(20px, 5vh, 40px);
    overflow-x: hidden;
  }

  /* ---------- the offer, doing all the work ---------- */

  .offer { margin-top: auto; }

  .offer p {
    font-size: clamp(15px, 4vw, 19px);
    letter-spacing: 0.01em;
    opacity: 0.85;
    margin-bottom: 0.4em;
  }

  .figure {
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: clamp(88px, 34vw, 200px);
    line-height: 0.82;
    letter-spacing: -0.045em;
    color: var(--mustard);
    display: block;
  }

  .figure sup {
    font-size: 0.36em;
    vertical-align: super;
    letter-spacing: -0.02em;
  }

  .claim {
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: clamp(26px, 8vw, 46px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin-top: 0.18em;
  }

  /* Fallback when we don't know the percentage */
  .figure.wordy {
    font-size: clamp(44px, 13vw, 84px);
    line-height: 0.94;
  }

  /* ---------- actions ---------- */

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.button {
    display: block;
    text-align: center;
    text-decoration: none;
    font-weight: 600;
    font-size: 18px;
    padding: 19px 22px;
    border-radius: 4px;
    border: 2px solid var(--ivory);
    transition: transform 0.08s ease;
  }

  a.primary {
    background: var(--ivory);
    color: var(--ink);
  }

  a.secondary {
    background: transparent;
    color: var(--ivory);
  }

  a.button:active { transform: translateY(2px); }

  a.button:focus-visible {
    outline: 3px solid var(--mustard);
    outline-offset: 3px;
  }

  .note {
    font-size: 14.5px;
    line-height: 1.5;
    opacity: 0.8;
    max-width: 34ch;
  }

  /* ---------- the code, as a last resort ---------- */

  .code {
    border-top: 2px solid rgba(255, 243, 228, 0.28);
    padding-top: 14px;
    font-size: 14px;
    opacity: 0.75;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .code b {
    font-family: "Archivo Black", system-ui, sans-serif;
    letter-spacing: 0.02em;
    opacity: 1;
  }

  /* ---------- one orchestrated entrance ---------- */

  @media (prefers-reduced-motion: no-preference) {
    .figure, .claim, .actions, .note, .code {
      animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
    }
    .figure  { animation-delay: 0.02s; }
    .claim   { animation-delay: 0.09s; }
    .actions { animation-delay: 0.16s; }
    .note    { animation-delay: 0.22s; }
    .code    { animation-delay: 0.26s; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (min-width: 620px) {
    body { max-width: 560px; margin: 0 auto; }
  }
</style>
</head>

<body>

  <div class="offer">
    <p id="lede">Scan worked.</p>
    <span class="figure" id="figure">10<sup>%</sup></span>
    <h1 class="claim" id="claim">off your first order</h1>
  </div>

  <div class="actions">
    <a class="button primary" id="open" href="#">Open the menu</a>
    <a class="button secondary" id="install" href="#">I don't have Telegram</a>
  </div>

  <p class="note" id="note">
    Ordering happens in Telegram — it's free, and your discount is already
    attached to this link.
  </p>

  <div class="code">
    <span>Your code</span>
    <b id="codeText">—</b>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);

  // ?c= is the source code from the QR. ?off= is the percentage, if known.
  const code = (params.get("c") || params.get("start") || "").trim();
  const off  = (params.get("off") || "").replace(/\D/g, "");

  const figure = document.getElementById("figure");
  const claim  = document.getElementById("claim");
  const lede   = document.getElementById("lede");

  // Never promise a number we weren't given.
  if (off) {
    figure.innerHTML = off + "<sup>%</sup>";
    claim.textContent = "off your first order";
  } else {
    figure.classList.add("wordy");
    figure.textContent = "Order in";
    claim.textContent = "a couple of taps";
    lede.textContent = "Scan worked.";
  }

  document.getElementById("codeText").textContent = code || "none";

  // Straight into the bot, carrying the source code so the discount applies.
  const deepLink = "https://t.me/" + BOT + (code ? "?start=" + encodeURIComponent(code) : "");
  document.getElementById("open").href = deepLink;

  // Send them to the right store, then they come back to this page.
  const ua = navigator.userAgent || "";
  const store = /iPhone|iPad|iPod/i.test(ua)
    ? "https://apps.apple.com/app/telegram-messenger/id686449807"
    : /Android/i.test(ua)
      ? "https://play.google.com/store/apps/details?id=org.telegram.messenger"
      : "https://telegram.org/";

  const install = document.getElementById("install");
  install.href = store;
  install.target = "_blank";
  install.rel = "noopener";

  // After they've gone to the store, the useful thing on returning is the
  // menu button — so say that plainly rather than leaving them guessing.
  install.addEventListener("click", function () {
    document.getElementById("note").textContent =
      "Once Telegram is installed, come back here and tap Open the menu.";
  });
})();
</script>

</body>
</html>
